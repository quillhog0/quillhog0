<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" style="background-color:#0B0E14; border-radius: 8px; border: 1px solid #1a202c;">
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F5A0" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Accent Line -->
  <rect x="0" y="246" width="100%" height="4" fill="#00F5A0" />
  
  <!-- Typography -->
  <text x="50" y="100" font-family="'Courier New', monospace" font-size="14" fill="#00F5A0" font-weight="bold" letter-spacing="4">MOD-04 // SYSTEM SHOWCASE</text>
  <text x="50" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" fill="#FFFFFF" font-weight="900" letter-spacing="-1">QUILLHOG ARCHITECTURE</text>
  <text x="50" y="190" font-family="'Courier New', monospace" font-size="16" fill="#8b949e">Production-Ready On-Chain Utility Infrastructure</text>
  
  <!-- Status Badge -->
  <rect x="780" y="86" width="170" height="28" rx="4" fill="#00F5A0" fill-opacity="0.1" stroke="#00F5A0" stroke-width="1"/>
  <text x="865" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#00F5A0" font-weight="bold">● ZERO-FRICTION</text>
</svg>
