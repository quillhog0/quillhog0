<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" style="background-color:#1A1410; border-radius: 8px; border: 1px solid #251D17;">
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF5600" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Accent Line -->
  <rect x="0" y="246" width="100%" height="4" fill="#FF5600" />

  <!-- Typography -->
  <text x="50" y="100" font-family="'Courier New', monospace" font-size="14" fill="#FF5600" font-weight="bold" letter-spacing="4">SPIKY ALIAS. WHOLE SHELF OF WORK.</text>
  <text x="50" y="150" font-family="'Courier New', monospace" font-size="52" fill="#FEEFD9" font-weight="900" letter-spacing="-1">QUILLHOG</text>
  <text x="50" y="190" font-family="'Courier New', monospace" font-size="16" fill="#A89F91">Non-custodial Solana utilities. No account. No KYC.</text>

  <!-- Status Badges -->
  <!-- Badge 1 -->
  <rect x="780" y="70" width="170" height="28" rx="4" fill="#FF5600" fill-opacity="0.1" stroke="#FF5600" stroke-width="1"/>
  <text x="865" y="89" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FF5600" font-weight="bold">● ZERO-DISK</text>

  <!-- Badge 2 -->
  <rect x="780" y="115" width="170" height="28" rx="4" fill="#FF5600" fill-opacity="0.1" stroke="#FF5600" stroke-width="1"/>
  <text x="865" y="134" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FF5600" font-weight="bold">● ZERO-PII</text>

  <!-- Badge 3 -->
  <rect x="780" y="160" width="170" height="28" rx="4" fill="#FF5600" fill-opacity="0.1" stroke="#FF5600" stroke-width="1"/>
  <text x="865" y="179" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#FF5600" font-weight="bold">● NO-ACCOUNT</text>
</svg>
